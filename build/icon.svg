<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Mi-Switch app icon: three rails for Claude Code, Codex and Pi; each knob rests on the provider in use. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34373f"/><stop offset="1" stop-color="#121318"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".03"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
    <filter id="knob" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#edge)" stroke-width="3"/>
  <g stroke="#ffffff" stroke-opacity=".2" stroke-width="40" stroke-linecap="round">
    <path d="M296 368h432M296 512h432M296 656h432"/>
  </g>
  <g filter="url(#knob)">
    <circle cx="398" cy="368" r="56" fill="#edeef0"/>
    <circle cx="626" cy="512" r="64" fill="#3e63dd" stroke="#9eb1ff" stroke-width="10"/>
    <circle cx="480" cy="656" r="56" fill="#edeef0"/>
  </g>
</svg>
